<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra Frutis design preview (password required)</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f5f1;color:#1d1d1b;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.box{width:min(400px,100%);background:#fff;border:1px solid #dcd9cf;border-radius:12px;padding:28px 24px}
h1{font-size:21px;line-height:1.25;margin:0 0 6px}
p{margin:0 0 18px;color:#55534c;font-size:15px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #8f8c82;background:#fff;color:#1d1d1b;font:inherit}
button{margin-top:14px;width:100%;min-height:46px;border:0;border-radius:999px;background:#1d1d1b;color:#fff;font:600 16px/1 inherit;font-family:inherit;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
input:focus-visible,button:focus-visible{outline:3px solid #1d1d1b;outline-offset:2px}
#msg{min-height:22px;margin:12px 0 0;font-size:14px;color:#8a2b12}
</style>
</head>
<body>
<div class="box">
<h1>Terra Frutis design preview</h1>
<p id="lead">Private preview. Enter the password to view it.</p>
<form id="f" autocomplete="off">
<label for="pw">Password</label>
<input id="pw" type="password" required autofocus>
<button id="go" type="submit">View the preview</button>
</form>
<p id="msg" role="status" aria-live="polite"></p>
</div>
<script>
(function(){
var SALT='07fe7faa0eec926edeac832af7101ab8',ITER=310000,MODE='index',BASES=["/terra-frutis-concepts/","/"],HKDF_SALT='tf-preview hkdf v1';
var te=new TextEncoder(),msg=document.getElementById('msg'),form=document.getElementById('f'),btn=document.getElementById('go');
function base(){
  if(MODE==='index')return location.pathname.replace(/[^\/]*$/,'');
  for(var i=0;i<BASES.length;i++)if(location.pathname.indexOf(BASES[i])===0)return BASES[i];
  return '/';
}
var B=base();
try{localStorage.removeItem('tfc-preview-key')}catch(e){} /* the key kept by the earlier version of this preview */
function unsupported(){form.hidden=true;msg.textContent='';document.getElementById('lead').textContent='This preview needs a normal browser window. Private windows in some browsers can’t open it.'}
/* Storage that exists but can't be used (blocked site data, some private modes) gives the same message. */
var STORAGE_ERRORS=['SecurityError','InvalidStateError','UnknownError','QuotaExceededError','NotSupportedError','NotAllowedError'];
function storageError(err){return !!err&&STORAGE_ERRORS.indexOf(err.name)>=0}
var hasIdb=false;try{hasIdb=!!window.indexedDB}catch(e){}
if(!('serviceWorker' in navigator)||!hasIdb||!window.crypto||!crypto.subtle){unsupported();return}
function hexb(s){var u=new Uint8Array(s.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(s.substr(i*2,2),16);return u}
function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function idb(){return new Promise(function(res,rej){var r;try{r=indexedDB.open('tf-preview',1)}catch(e){rej(e);return}r.onupgradeneeded=function(){r.result.createObjectStore('keys')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
idb().then(function(d){d.close()},function(){unsupported()});
function put(k){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction('keys','readwrite');t.objectStore('keys').put(k,'k');t.oncomplete=function(){d.close();res()};t.onerror=function(){rej(t.error)}})})}
function get(){return idb().then(function(d){return new Promise(function(res){var q=d.transaction('keys','readonly').objectStore('keys').get('k');q.onsuccess=function(){d.close();res(q.result||null)};q.onerror=function(){d.close();res(null)}})}).catch(function(){return null})}
function derive(pw){
  return crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
    return crypto.subtle.deriveBits({name:'PBKDF2',salt:hexb(SALT),iterations:ITER,hash:'SHA-256'},k,256)}).then(function(bits){
    return crypto.subtle.importKey('raw',bits,'HKDF',false,['deriveKey'])}).then(function(h){
    var p=function(info){return{name:'HKDF',hash:'SHA-256',salt:te.encode(HKDF_SALT),info:te.encode(info)}};
    return Promise.all([crypto.subtle.deriveKey(p('tf-preview enc v1'),h,{name:'AES-GCM',length:256},false,['decrypt']),
      crypto.subtle.deriveKey(p('tf-preview name v1'),h,{name:'HMAC',hash:'SHA-256',length:256},false,['sign'])])}).then(function(ks){return{enc:ks[0],name:ks[1]}});
}
/* The password check file has a fixed name (from the salt), so a wrong password costs no failed request. */
function check(k){
  return crypto.subtle.digest('SHA-256',te.encode('check:'+SALT)).then(function(s){var n=hex(s).slice(0,24);
    return fetch(B+'c/'+n.slice(0,2)+'/'+n.slice(2)+'.bin',{cache:'no-cache'})}).then(function(r){if(!r.ok)throw new Error('network');return r.arrayBuffer()}).then(function(b){
    b=new Uint8Array(b);return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12),additionalData:te.encode('__check')},k.enc,b.slice(12))}).then(function(p){
    if(new TextDecoder().decode(p)!=='tf-preview-check-v1')throw new Error('check');return k});
}
function start(){
  return navigator.serviceWorker.register(B+'sw.js',{scope:B}).then(function(){return navigator.serviceWorker.ready}).then(function(){
    if(navigator.serviceWorker.controller)return;
    return new Promise(function(res){navigator.serviceWorker.addEventListener('controllerchange',function(){res()});setTimeout(res,3000)})}).then(function(){location.reload()});
}
/* Keys already stored but this page was not opened through them: start once, then ask again. */
get().then(function(k){
  if(!k)return;
  var tried=false;try{tried=sessionStorage.getItem('tf-preview-start')===location.pathname;sessionStorage.setItem('tf-preview-start',location.pathname)}catch(e){}
  if(!tried&&!navigator.serviceWorker.controller){msg.textContent='Opening…';start().catch(function(err){if(storageError(err))unsupported();else msg.textContent=''})}
});
form.addEventListener('submit',function(e){
  e.preventDefault();btn.disabled=true;msg.textContent='Checking…';
  try{sessionStorage.removeItem('tf-preview-start')}catch(x){}
  derive(document.getElementById('pw').value).then(check).then(put).then(function(){msg.textContent='Opening…';return start()}).catch(function(err){
    btn.disabled=false;if(storageError(err)){unsupported();return}
    msg.textContent=(err&&(err.name==='OperationError'||err.message==='check'))?'Wrong password, try again.':'The preview could not be opened. Please try again.'});
});
})();
</script>
</body>
</html>
